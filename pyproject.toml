[project]
name = "dq-sentinel"
version = "0.1.0"
description = "Autonomous data-quality agent for Fivetran + BigQuery (Google Cloud Rapid Agent Hackathon, Fivetran track)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk>=1.0",
    "mcp>=1.0",
    "google-cloud-bigquery>=3.25",
    "google-cloud-secret-manager>=2.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dq_sentinel"]
